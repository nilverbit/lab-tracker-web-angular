<div class="min-h-screen flex flex-col items-center justify-center gap-6">
  <h1 class="text-3xl font-bold text-primary">SIGEMAL</h1>

  <div class="rounded-xl bg-white shadow px-6 py-4 border-l-4 border-accent">
    @if (conectado() === true) {
      <p class="text-ok font-semibold">Backend conectado</p>
    } @else if (conectado() === false) {
      <p class="text-danger font-semibold">Sin conexión</p>
    } @else {
      <p class="text-muted">Verificando...</p>
    }
    <p class="text-muted text-sm">{{ mensaje() }}</p>
  </div>

  <div class="flex gap-2">
    <div class="h-8 w-8 rounded bg-primary"></div>
    <div class="h-8 w-8 rounded bg-primary-dark"></div>
    <div class="h-8 w-8 rounded bg-accent"></div>
    <div class="h-8 w-8 rounded bg-ink"></div>
  </div>
</div>
